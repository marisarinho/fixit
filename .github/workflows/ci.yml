name: Esteira de qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências travadas
        run: uv sync --locked

      - name: Rodar hooks de qualidade
        run: uv run pre-commit run --all-files

      - name: Rodar testes e conferir cobertura
        run: |
          uv run python -m coverage run manage.py test --shuffle
          uv run python -m coverage report

      - name: Validar mensagens dos commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_SHA"
          else
            range="$BEFORE_SHA..$PUSH_SHA"
          fi

          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-message.txt"
            uvx --from conventional-pre-commit conventional-pre-commit "$RUNNER_TEMP/commit-message.txt"
          done
